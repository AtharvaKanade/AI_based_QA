[pytest]
testpaths = tests ai_engine/generated
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --html=reports/report.html
    --self-contained-html
markers =
    ui: mark test as UI automation test (Playwright)
    api: mark test as REST API test
    ai: mark test as AI-generated or AI-validation test
    smoke: mark test as critical smoke test
    regression: mark test as regression test
filterwarnings =
    ignore::pytest.PytestRemovedIn10Warning
